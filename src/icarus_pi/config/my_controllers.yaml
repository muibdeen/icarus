controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    mech_cont:
      type: mech_drive_controller/MechDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

mech_cont:
  ros__parameters:
    publish_rate: 45.0
    base_frame_id: base_link
    odom_frame_id: odom

    wheels_per_side: 2
    front_left_wheel_name: ["frontLeft_joint"]
    front_right_wheel_name: ["frontRight_joint"]
    back_left_wheel_name: ["backLeft_joint"]
    back_right_wheel_name: ["backRight_joint"]
    wheel_separation_width: 0.21
    wheel_separation_length: 0.1665
    wheel_radius: 0.024

    use_stamped_vel: false
    open_loop: false
    enable_odom_tf: true
    pose_covariance_diagonal: [0.001, 0.001, 1e6, 1e6, 1e6, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 1e6, 1e6, 1e6, 0.001]
    cmd_vel_timeout: 0.5
    velocity_rolling_window_size: 20


joint_broad:
  ros__parameters:
    update_rate: 50
    joints: ["frontLeft_joint", "backLeft_joint", "frontRight_joint", "backRight_joint"]
    interfaces: ["position", "velocity"]
